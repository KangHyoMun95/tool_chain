services:
  db:
    image: postgres:16.3
    container_name: tool-chain-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: tool_chain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tool_chain"]
      interval: 3s
      timeout: 3s
      retries: 20
  flyway:
    image: flyway/flyway:10.22.0
    container_name: tool-chain-flyway
    command: -connectRetries=10 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/tool_chain
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: 123456
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./apps/api/db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  redis:
    image: redis:7.2-bookworm
    container_name: tool-chain-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 20 1 --loglevel warning --requirepass 123456
volumes:
  postgres_data:
  redis-data:
    driver: local
