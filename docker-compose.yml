services:
  # Local Postgres, only started with `--profile local-db` (set DB_HOST=db). Skip it when DB_HOST points to an external database.
  db:
    profiles: ["local-db"]
    image: postgres:16.3
    container_name: tool-chain-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  flyway:
    image: flyway/flyway:13.11.1
    container_name: tool-chain-flyway
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://${DB_HOST:?set DB_HOST in .env}:${DB_PORT:-5432}/${POSTGRES_DB:?set POSTGRES_DB in .env}?sslmode=${DB_SSLMODE:-prefer}
      FLYWAY_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 10
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_VALIDATE_ON_MIGRATE: "true"
    volumes:
      - ./db/migrations:/flyway/sql:ro
    restart: "no"
  redis:
    image: redis:7.2-bookworm
    container_name: tool-chain-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: tool-chain-api
    container_name: tool-chain-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:?set DB_HOST in .env}:${DB_PORT:-5432}/${POSTGRES_DB}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_PORT: 4000
      # Fixed name: never use `docker compose up --scale api`; add a separate service with its own name instead
      CONSUMER_NAME: api-worker-0
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Billing: phí mỗi dự đoán (bắt buộc), job hủy ván không có result (bật sau khi đã kiểm tra dữ liệu game_sessions)
      PREDICTION_FEE: ${PREDICTION_FEE:?set PREDICTION_FEE in .env}
      GAME_SESSION_CANCEL_AFTER_MINUTES: ${GAME_SESSION_CANCEL_AFTER_MINUTES:-5}
      GAME_SESSION_CANCEL_ENABLED: ${GAME_SESSION_CANCEL_ENABLED:-false}
      HAS_REFUND: ${HAS_REFUND:-true}
      HUB_STALE_RESET_MS: ${HUB_STALE_RESET_MS:-60000}
      API_LOG_DEBUG: ${API_LOG_DEBUG:-false}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api').then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
  web-portal:
    build:
      context: .
      dockerfile: apps/web-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SHOW_STREAM_DEBUG: ${NEXT_PUBLIC_SHOW_STREAM_DEBUG:-false}
        NEXT_PUBLIC_PREDICTION_SOURCE: ${NEXT_PUBLIC_PREDICTION_SOURCE:-live}
    image: tool-chain-web-portal
    container_name: tool-chain-web-portal
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-5001}:3001"
    depends_on:
      - api
  ai:
    build: ./apps/ai
    image: tool-chain-ai
    container_name: tool-chain-ai
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      # AI chỉ ĐỌC DB. Ưu tiên user chỉ có SELECT (SQL tạo role: apps/ai/README.md); để trống thì dùng tài khoản chính.
      DATABASE_URL_READONLY: ${AI_DATABASE_URL_READONLY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:?set DB_HOST in .env}:${DB_PORT:-5432}/${POSTGRES_DB}?sslmode=${DB_SSLMODE:-prefer}
      # Tên consumer cố định: không dùng `docker compose up --scale ai`; cần thêm instance thì khai báo service riêng với tên riêng
      AI_CONSUMER_NAME: ai-worker-0
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      AI_HISTORY_DB_WINDOW_HOURS: ${AI_HISTORY_DB_WINDOW_HOURS:-6}
    depends_on:
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
  # crawl-agent:
  #   build: ./apps/crawl-agent
  #   image: crawl-agent
  #   container_name: crawl-agent
  #   restart: unless-stopped
  #   init: true
  #   shm_size: "1gb"
  #   env_file: apps/crawl-agent/.env
  #   environment:
  #     TZ: Asia/Ho_Chi_Minh
  #     REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
  #     VNC: "${VNC:-0}"
  #     SX_LOBBY: ${SX_LOBBY:-}
  #     SX_CATEGORY_1: ${SX_CATEGORY_1:-}
  #   ports:
  #     - "127.0.0.1:5900:5900"
  #   volumes:
  #     - ./debug:/home/bot/app/debug
  #     - brave-profile:/home/bot/.brave-automation
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   stop_grace_period: 30s
  #   healthcheck:
  #     test: ["CMD", "curl", "-sf", "http://127.0.0.1:9222/json/version"]
  #     interval: 30s
  #     timeout: 5s
  #     start_period: 60s
  #     retries: 3
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "5"
  crawl-agent-v2:
    build: ./apps/crawler_v2
    image: crawler-v2
    container_name: crawl-agent-v2
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    stop_grace_period: 30s
    env_file: apps/crawler_v2/.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      VNC: "${VNC:-0}"
      SX_LOBBY: ${SX_LOBBY:-}
      SX_CATEGORY_1: ${SX_CATEGORY_1:-}
    # ports:
    # - "127.0.0.1:5900:5900"
    volumes:
      - brave-profile:/home/bot/.brave-automation   # profile Brave (như v1)
      - bot-output:/home/bot/app/output             # [v2] session.json: restart không phải login lại
      - ./debug:/home/bot/app/debug
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  redis-data:
    driver: local
  brave-profile:
  bot-output:
